name: Windows build and test

on:
  pull_request:
  push:
    branches: [main, proto/issue-7]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  helper-tests:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run the Windows CI helper regressions
        shell: pwsh
        timeout-minutes: 7
        run: python -B scripts/ci/selftest.py
      - name: Retain bounded helper logs and receipts
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-ci-helpers-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/codegraph-windows-ci-helpers/*/receipt.json
            ${{ runner.temp }}/codegraph-windows-ci-helpers/*/*/result.json
            ${{ runner.temp }}/codegraph-windows-ci-helpers/*/*/*.log
          if-no-files-found: warn
          retention-days: 7

  build-test:
    runs-on: windows-2022
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.x'
          architecture: x64
          package-manager-cache: false
      - name: Install, build, and run the complete test workspace
        shell: pwsh
        timeout-minutes: 57
        run: |
          python scripts/ci/windows.py
          $commandExit = $LASTEXITCODE
          python scripts/ci/verify-windows.py "$env:RUNNER_TEMP/codegraph-windows-ci"
          $receiptExit = $LASTEXITCODE
          if ($commandExit -ne 0) { exit $commandExit }
          exit $receiptExit
      - name: Retain bounded command logs and receipts
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/codegraph-windows-ci/*/receipt.json
            ${{ runner.temp }}/codegraph-windows-ci/*/*/result.json
            ${{ runner.temp }}/codegraph-windows-ci/*/*/*.log
          if-no-files-found: warn
          retention-days: 7
